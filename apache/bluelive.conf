# BlueLive-Lite UI hardening (VAPT V010-V014, INF002). Included at the end of httpd.conf.
# API_ORIGIN (scheme://host:port of the backend API) comes from the container environment,
# e.g. docker run -e API_ORIGIN=http://localhost:8000 ...

<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>

# INF002: no directory listing (overrides "Options Indexes" of the stock httpd.conf).
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Do not reveal the Apache version.
ServerTokens Prod
ServerSignature Off

# V010 Content-Security-Policy. The app loads nothing from other domains; inline styles are
# used by the UI components; connect-src must allow the API.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${API_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
# V011
Header always set X-Frame-Options "DENY"
# V012
Header always set X-Content-Type-Options "nosniff"
# V013
Header always set Referrer-Policy "strict-origin-when-cross-origin"
# V014
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
